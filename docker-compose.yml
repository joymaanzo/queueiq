services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - queueiq_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  queueiq_data:
    name: queueiq_data
