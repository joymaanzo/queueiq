services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queueiq
      POSTGRES_PASSWORD: queueiq
      POSTGRES_DB: queueiq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueiq -d queueiq"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://queueiq:queueiq@postgres:5432/queueiq
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
    name: queueiq_postgres_data
  app_data:
    name: queueiq_app_data
